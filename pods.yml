apiVersion: v1
kind: Pod
metadata:
  name: flutter
spec:
  containers:
    - name: flutter
      image: flutter_app
      ports:
        - containerPort: 80
          hostPort: 8088
---
apiVersion: v1
kind: Pod
metadata:
  name: cpp-api
spec:
  containers:
    - name: api
      image: cpp_api
      ports:
        - containerPort: 8081
      env:
        - name: DB_HOST
          value: "db"
        - name: JWT_SECRET
          value: "secret_jwt"
