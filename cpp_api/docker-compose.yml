# Use postgres/example user/password credentials

services:

  database:
    image: postgres
    restart: always
    container_name: db
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: restapi
    
    ports:
      - 5432:5432
      
    # 5432
    volumes:
      - datavolume:/data/postgres
      - ./database/script.sql:/docker-entrypoint-initdb.d/script.sql

  adminer:
    image: adminer
    restart: always
    container_name: gui
    ports:
      - 8083:8080

volumes:
  datavolume:
